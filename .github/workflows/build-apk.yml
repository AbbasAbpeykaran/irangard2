name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK on EAS
        run: eas build --platform android --profile preview --non-interactive --wait --json > build.json

      - name: Download APK
        run: |
          URL=$(jq -r '.[0].artifacts.buildUrl' build.json)
          curl -L "$URL" -o IranGard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IranGard-apk
          path: IranGard.apk